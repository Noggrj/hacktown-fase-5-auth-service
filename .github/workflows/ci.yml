name: CI — fiapx-auth-service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispara o job "deploy" (build+push da imagem pro ECR, rollout no EKS).
  # Não roda em push/PR de propósito: sem cluster provisionado por padrão
  # (ver fiapx-infra), isso ficaria vermelho sempre. Ver "Deploy" no
  # README pros Secrets necessários antes de disparar.
  workflow_dispatch: {}

env:
  GO_VERSION: "1.25"
  COVERAGE_MIN: "70"
  # Packages with real business logic. Excluded from the gate:
  #   cmd/api                 — process wiring, exercised by the smoke test below, not unit tests
  #   internal/platform/db          — thin pgxpool wrapper, needs a live Postgres to test meaningfully
  #   internal/platform/logging     — 3-line slog wrapper
  #   internal/auth/gateway         — Postgres repository impl, needs a live Postgres (integration test, not yet wired in CI)
  COVERAGE_PKGS: "./internal/auth/domain/... ./internal/auth/usecase/... ./internal/auth/delivery/... ./internal/platform/jwt/... ./internal/platform/httpauth/... ./internal/platform/health/... ./internal/platform/config/... ./internal/platform/metrics/..."

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

      - name: Run full test suite
        run: go test -count=1 -race -timeout 120s ./...

      - name: Coverage (business-logic packages only)
        run: |
          go test -count=1 -coverprofile=coverage.out ${{ env.COVERAGE_PKGS }}
          go tool cover -func=coverage.out | tail -10

      - name: Coverage gate (>= ${{ env.COVERAGE_MIN }}%)
        run: |
          PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          echo "::notice::Coverage = $PCT% (gate $COVERAGE_MIN%)"
          awk -v p="$PCT" -v m="$COVERAGE_MIN" 'BEGIN{exit (p+0<m+0)?1:0}'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage
          path: coverage.out
          retention-days: 5

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local only — no registry push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fiapx-auth-service:ci
          build-args: VERSION=${{ github.sha }}

      - name: Container smoke test (local build only)
        run: |
          docker run --rm fiapx-auth-service:ci ./server --version

  # Só roda com o disparo manual (workflow_dispatch) — nunca em push/PR.
  # Precisa de 4 Secrets no repo: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  # AWS_SESSION_TOKEN (conta AWS Academy voclabs usa credenciais
  # temporárias — sessão expira em ~4h, renova antes de disparar) e
  # DB_PASSWORD (senha do usuário "auth" no RDS, definida no
  # terraform apply do fiapx-infra) + JWT_SECRET (tem que ser o MESMO
  # valor configurado no fiapx-video-service — os dois validam o token
  # com o mesmo segredo). Pressupõe que "terraform apply" já rodou no
  # fiapx-infra (cluster, RDS e ECR precisam existir antes).
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    environment: production
    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: fiapx-cluster
      ECR_REPO: fiapx-auth-service
    steps:
      - uses: actions/checkout@v4

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
          build-args: VERSION=${{ github.sha }}

      - name: Atualiza kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Cria/atualiza o Secret fiapx-auth-secret
        run: |
          kubectl create namespace fiapx --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic fiapx-auth-secret -n fiapx \
            --from-literal=DB_URL="postgres://auth:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:5432/fiapx_auth?sslmode=require" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplica os manifests (namespace, configmap, deployment, service)
        run: kubectl apply -f k8s/base/

      - name: Roda as migrations do banco
        run: |
          kubectl create configmap fiapx-auth-migrations -n fiapx --from-file=migrations \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete job/fiapx-auth-migrate -n fiapx --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          kubectl wait --for=condition=complete --timeout=120s job/fiapx-auth-migrate -n fiapx

      - name: Atualiza a imagem do Deployment
        run: |
          kubectl set image deployment/fiapx-auth app=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }} -n fiapx
          kubectl rollout status deployment/fiapx-auth -n fiapx --timeout=180s
