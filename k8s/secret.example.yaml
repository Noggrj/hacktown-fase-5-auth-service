# Exemplo apenas — em produção o secret real é criado via kubectl no CI
# usando valores do SSM/Secrets Manager. NUNCA commitar o valor real.
#
# Este arquivo fica FORA de k8s/base/ de propósito (lição aprendida em
# autorepair-billing-service): o deploy roda `kubectl apply -f k8s/base/`
# aplicando todo .yaml da pasta — se este arquivo morasse lá com o mesmo
# nome de Secret, sobrescreveria o secret real com os placeholders
# "CHANGE_ME" a cada deploy.
#
# JWT_SECRET MUST match every other fiapx-* service's JWT_SECRET —
# distributed as the same value across all of them.
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-auth-secret
  namespace: fiapx
type: Opaque
stringData:
  DB_URL: "postgres://auth:CHANGE_ME@host:5432/fiapx_auth?sslmode=require"
  JWT_SECRET: "CHANGE_ME_TO_A_RANDOM_32_BYTE_VALUE"
